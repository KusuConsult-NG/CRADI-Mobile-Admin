name: CI

on:
  push:
    branches: [main, develop, supabase-migration]
  pull_request:
    branches: [main, develop, supabase-migration]

# Cancel in-progress runs on the same branch to save quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    # No real project values are needed: the type check, the lint and the
    # production build only require NEXT_PUBLIC_* to be syntactically valid.
    # They are inlined into the bundle at build time, so a real build for
    # deployment sets them in Railway — never a secret (see .env.example).
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # Matches package.json engines
          cache: npm

      # `npm ci` also fails when package-lock.json has drifted from
      # package.json, which is the check we want on every push.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint (zero warnings policy)
        run: npx eslint . --max-warnings 0

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: check

    # The suite runs against an in-memory Supabase mock (e2e/mock-supabase.mjs)
    # and builds the app itself with the mock's URL, so it needs no secrets and
    # never touches the live Supabase project.
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned browser build matching the @playwright/test version in
      # package.json; --with-deps installs the system libraries it needs.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results/
          retention-days: 7
